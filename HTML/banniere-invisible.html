<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bannière sCAPTCHA</title>
    <style>
        .scaptcha-badge {
            position: fixed;
            bottom: 14px;
            right: -186px;
            width: 256px;
            height: 60px;
            background-color: #f9f9f9;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.14), 0 4px 8px rgba(0, 0, 0, 0.28);
            display: flex;
            align-items: center;
            transition: right 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 99999;
            overflow: hidden;
            user-select: none;
            font-family: Roboto, Arial, sans-serif;
        }

        .scaptcha-badge:hover {
            right: 0;
        }

        .badge-icon-container {
            width: 70px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            flex-shrink: 0;
        }

        .badge-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            transform: translateY(-2px); /* Ajustement de la hauteur du logo */
        }

        .badge-content {
            width: 186px;
            height: 100%;
            padding-right: 10px;
            padding-left: 12px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            background-color: #7e5dce; /* Fond violet */
        }

        .badge-text {
            font-size: 14px;
            color: #FFFFFF; /* Texte blanc */
            line-height: 1.2;
            font-weight: 400;
        }
    </style>
</head>
<body>

<div class="scaptcha-badge" role="status" aria-live="polite">
    <div class="badge-icon-container">
        <img class="badge-logo" src="https://u.cubeupload.com/Scratch_2_0_2_4/Capturedecran2026080.png" alt="Logo sCAPTCHA">
    </div>
    <div class="badge-content">
        <div class="badge-text">
            Protégé par sCAPTCHA
        </div>
    </div>
</div>

</body>
</html>
