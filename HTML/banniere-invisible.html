<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge style sCAPTCHA Invisible</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Roboto, Arial, sans-serif;
      background-color: #f4f5f7;
      min-height: 100vh;
    }

    .recaptcha-badge {
      position: fixed;
      bottom: 20px;
      right: -210px;
      width: 310px;
      height: 90px;
      background-color: #f9f9f9;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.14), 0 6px 14px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      transition: right 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 99999;
      overflow: hidden;
      user-select: none;
    }

    .recaptcha-badge:hover {
      right: 0;
    }

    .recaptcha-icon-container {
      width: 100px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9f9f9;
      flex-shrink: 0;
    }

    .recaptcha-logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .recaptcha-content {
      width: 210px;
      padding-right: 16px;
      display: flex;
      align-items: center;
      box-sizing: border-box;
    }

    .recaptcha-text {
      font-size: 15px;
      color: #444444;
      line-height: 1.3;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="recaptcha-badge" role="status" aria-live="polite">
    <div class="recaptcha-icon-container">
      <img class="recaptcha-logo" src="https://u.cubeupload.com/Scratch_2_0_2_4/IMG4788.jpeg" alt="Logo sCAPTCHA">
    </div>
    <div class="recaptcha-content">
      <div class="recaptcha-text">
        Protégé par sCAPTCHA
      </div>
    </div>
  </div>

</body>
</html>
